
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }

  .bar {
    position: absolute;
    left: 115px;
    width: 1690px;
    height: 4px;
    overflow: hidden;
    border-radius: 4px;
  }

  .bar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      #6E5393 0%,
      #CF2664 25%,
      #779F5C 50%,
      #6E5393 75%,
      #CF2664 100%
    );
    background-size: 200% 100%;
    animation: flow 12s linear infinite;
  }

  .top {
    top: 210px;
  }

  .bottom {
    top: 850px;
  }

  @keyframes flow {
    from { background-position: 0% 0; }
    to { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div class="bar top"></div>
  <div class="bar bottom"></div>
</body>
</html>
