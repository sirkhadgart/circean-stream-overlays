
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Circean Studios - Animated Gradient Bars</title>

  <style>
    /* ==========================================
       CIRCEAN STUDIOS
       ANIMATED GRADIENT BARS
       ========================================== */

    :root {
      --purple: #6E5393;
      --pink: #CF2664;
      --green: #779F5C;

      --animation-speed: 12s;
      --bar-height: 4px;
    }

    /* ==========================================
       1. TRANSPARENT CANVAS
       ========================================== */

    html,
    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    /* ==========================================
       2. GRADIENT BAR CONTAINERS
       ========================================== */

    .bar {
      position: absolute;

      left: 115px;
      width: 1690px;
      height: var(--bar-height);

      overflow: hidden;
      border-radius: 999px;
    }

    /* ==========================================
       3. SEAMLESS GRADIENT ANIMATION
       ========================================== */

    .bar::before {
      content: "";
      position: absolute;

      top: 0;
      left: 0;

      width: 200%;
      height: 100%;

      /*
         The gradient contains two identical
         color sequences.

         Translating by 50% of its own width
         moves exactly one sequence, allowing
         the animation to repeat seamlessly.
      */

      background: linear-gradient(
        90deg,

        var(--purple) 0%,
        var(--pink) 12.5%,
        var(--green) 25%,
        var(--purple) 50%,

        var(--pink) 62.5%,
        var(--green) 75%,
        var(--purple) 100%
      );

      animation: gradientFlow
        var(--animation-speed)
        linear
        infinite;

      will-change: transform;
    }

    @keyframes gradientFlow {
      from {
        transform: translateX(-50%);
      }

      to {
        transform: translateX(0);
      }
    }

    /* ==========================================
       4. BAR POSITIONS
       ========================================== */

    .top {
      top: 210px;
    }

    .bottom {
      top: 850px;
    }

    /* ==========================================
       5. OPTIONAL ACCESSIBILITY
       ========================================== */

    @media (prefers-reduced-motion: reduce) {
      .bar::before {
        animation: none;
      }
    }

  </style>
</head>

<body>

  <!-- Top gradient -->
  <div class="bar top"></div>

  <!-- Bottom gradient -->
  <div class="bar bottom"></div>

</body>
</html>
